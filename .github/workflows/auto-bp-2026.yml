name: APUMIA-BP-2026 Automated Generator
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  generate-bp:
    if: contains(github.event.issue.labels.*.name, 'bp-2026-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Deterministic 28-Digit Decimal Study & Notary Seal
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 scripts/generate_bp_2026.py
      - name: Post Verified Certificate & Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body-file bp_report.md
          gh issue close "$ISSUE_NUM" --repo "${{ github.repository }}"
