name: Auto PR Syndicate & IndexNow
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p press-releases && python3 scripts/pr_syndicate.py
      - run: |
          git config user.name "apumia-pr-bot"
          git config user.email "bot@apumia.space"
          git add press-releases/
          git commit -m "chore(pr): auto-publish SMB dispatch & IndexNow ping" || exit 0
          git push
