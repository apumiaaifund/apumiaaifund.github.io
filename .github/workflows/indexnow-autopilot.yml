  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow Pool
        run: |
          H="apumiaaifund.github.io"
          curl -fsS -X POST "https://yandex.com" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"${H}\",\"key\":\"apumia2026spaceindexnow8841\",\"keyLocation\":\"https://${H}/apumia2026spaceindexnow8841.txt\",\"urlList\":[\"https://${H}/\",\"https://${H}/cpa-audit-desk/\",\"https://${H}/1099-misclassification-calculator/\",\"https://${H}/insure-proof-demo/\",\"https://${H}/deal-guard-demo/\",\"https://${H}/compliance-os-demo/\",\"https://${H}/llms.txt\",\"https://${H}/llms-full.txt\",\"https://${H}/sitemap.xml\"]}"
