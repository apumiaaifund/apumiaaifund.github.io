name: Care Radar Autopilot
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deepen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/care_autopilot.py
      - run: |
          git config user.name "apumia-care-bot"
          git config user.email "bot@apumia.space"
          git add index.html
          git diff-index --quiet HEAD || (git commit -m "chore(care): auto-deepen niche focus from live radar" && git push)
